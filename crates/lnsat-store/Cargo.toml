[package]
name = "lnsat-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Embedded single-node SQLite durability foundation for LNSAT"

[dependencies]
getrandom = "0.2.17"
lnsat-auth = { path = "../lnsat-auth" }
lnsat-contracts = { path = "../lnsat-contracts" }
rusqlite = { version = "0.40.1", features = ["backup", "bundled", "limits"] }
sha2 = { version = "0.11.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = { version = "2.6.1", default-features = false }
zeroize = "1.9.0"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["dir", "fs", "user"] }
nix_stat = { package = "nix", version = "=0.29.0", default-features = false, features = ["fs"] }

[dev-dependencies]
rusqlite = { version = "0.40.1", features = ["functions"] }

[lints]
workspace = true
