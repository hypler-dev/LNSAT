[workspace]
members = [
  "crates/lnsat-auth",
  "crates/lnsat-contracts",
  "crates/lnsat-store",
  "crates/lnsatd",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/hypler-dev/LNSAT"
homepage = "https://github.com/hypler-dev/LNSAT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
